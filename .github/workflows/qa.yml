name: QA

on:
  push:
    branches: [main]
  pull_request:

jobs:
  qa:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      # Vorerst ohne Lockfile (AI-Studio-Kompatibilität, siehe docs/ci/README.md).
      - run: npm install --no-audit --no-fund
      - name: Typprüfung
        run: npm run -s lint
      - name: any-Ratsche
        run: node scripts/qa/check-any.mjs
      - name: Tests
        run: npm test
      - name: Formeln (KaTeX)
        run: npm run -s check:formeln
      - name: Quellen
        run: npm run -s check:quellen
      - name: Zahlformat
        run: npm run -s check:zahlen
      - name: Build
        run: npx vite build
      - name: Bundle-Budget
        run: node scripts/qa/check-bundle.mjs
      - name: Verwaiste Dateien
        run: node scripts/qa/check-verwaist.mjs --strict
