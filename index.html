        <article id="grundlagen_info_seo">
          <h3>Grundlagen &amp; physikalische Einheiten</h3>
          <p>Dieses Modul behandelt die grundlegenden Einheiten im Bauwesen sowie Materialkennwerte und physikalische Gesetzmäßigkeiten. Es bietet Nachschlagewerke für Rohdichten, Festigkeiten, Wärmeleitfähigkeiten und Sicherheitsbeiwerte.</p>
        </article>

        <!-- Labor -->
        <article id="labor_info_seo">
          <h3>Labor &amp; Statistische Baustoffprüfung</h3>
          <p>Fokus auf zerstörungsfreie und zerstörende Prüfungen. Erläuterung der Probenahmeverfahren und statistische Instrumente zur Festigkeitsermittlung aus einer Serie von n Prüfzylindern oder Würfeln nach DIN EN 206.</p>
        </article>

        <!-- Baustoffe von A bis Z -->
        <article id="baustoffe_info_seo">
          <h3>Baustoff-Enzyklopädie</h3>
          <p>Datenbank für alle relevanten Baustoffe: Gesteinskörnungen, Ziegelmauerwerk, Baugips, Kalk, Lehmbau, Konstruktionsstahl, Nichteisenmetalle, Bauholz, modifiziertes Holz, Kunststoffe, Mineralfaserdämmstoffe und nachwachsende Rohstoffe.</p>
        </article>

        <!-- Bauprodukte -->
        <article id="bauprodukte_info_seo">
          <h3>Bauproduktenrecht &amp; CPR-Novelle (Verordnung (EU) 2024/3110)</h3>
          <p>Leitfaden zum novellierten EU-Bauproduktenrecht Stand 2026: Verordnung (EU) 2024/3110, Einführung des Digitalen Produktpasses (DPP), kombinierte Leistungs- und Konformitätserklärung (DoPC) mit verpflichtenden GWP-Kennwerten nach DIN EN 15804+A2 sowie AVCP-Systeme inklusive System 3+ (Validierung der Umweltleistungsbewertung / LCA).</p>
        </article>

        <!-- Bauprodukte & Innovationen -->
        <article id="bp_innovationen_seo">
          <h3>Bauprodukt-Innovationen, F&amp;E &amp; Technology Readiness Level (TRL)</h3>
          <p>Systematische Reifegradbewertung (TRL 1 bis 9 nach DIN EN ISO 16290 und Horizon Europe) für Baustoffe und Bauprodukte. Phasen von der akademischen Grundlagenforschung über Werks-Scale-Up und Reallabore (ZiE) bis zur DIBt-Zulassung (abZ / aBG) und CE-Kennzeichnung nach BauPVO. Portraits von Zukunftswerkstoffen: Carbonbeton, Geopolymere und alkalisch aktivierte Bindemittel (AAM), Myzel-Biokomposite, bakteriell selbstheilender Bio-Beton sowie CO2-Mineralisierung (CCU).</p>
        </article>

        <!-- Betontechnologie -->
        <article id="beton_info_seo">
          <h3>Betontechnologie &amp; Transportbeton (DIN 1045-1000 &amp; DIN 1045-2:2023-08)</h3>
          <p>Umfassende Systematik nach DIN 1045-1000, DIN 1045-2 und DIN 1045-3 (Stand 2026) in Verbindung mit DIN EN 206. Behandelt Betonbauqualitätsklassen (BBQ-N, BBQ-E, BBQ-S), Überwachungsklassen ÜK 1 bis ÜK 3, die Aufgaben des BBQ-Ingenieurs, dekarbonisierte k-Wert-Konzepte für Typ-II-Zusatzstoffe sowie Hydratationswärme- und Ausbreitmaß-Simulationen.</p>
        </article>

        <!-- Stahl- und Spannbeton -->
        <article id="stahlbeton_info_seo">
          <h3>Konstruktiver Stahlbetonbau &amp; Eurocode 2 (DIN EN 1992-1-1 &amp; 2. Generation)</h3>
          <p>Bemessung nach DIN EN 1992-1-1 (Eurocode 2 + Nationaler Anhang DE) für Biegung, Querkraft, Stützen, Durchstanzen, Verankerung und Rissbreite (GZG). Inklusive vergleichender Analyse der 2. Generation des Eurocode 2 (prEN 1992-1-1 / FprEN 1992-1-1:2023ff.) mit CSCT-Querkraft- und Durchstanzmodellen sowie Expositions-Widerstandsklassen (ERC).</p>
        </article>

          <h3>Ingenieurholzbau nach Eurocode 5</h3>
          <p>Bemessung von Trägern, Stützen und Holzverbindungen. Kennwerte für Brettschichtholz (BSH), Konstruktionsvollholz (KVH) und kreuzweise verleimtes Massivholz (CLT).</p>
        </article>

          <p>Experimentelle Ermittlung des Elastizitätsmoduls, Bestimmung von Zug- und Druckspannungen und Materialverhalten unter mehraxialen Beanspruchungen.</p>
        </article>

        <!-- Bauphysik -->
        <article id="bauphysik_info_seo">
          <h3>Bauphysik, Wärmeschutz &amp; U-Wert Rechner</h3>
          <p>Interaktives Berechnungstool für den Wärmedurchgangskoeffizienten (U-Wert) mehrschichtiger Wände, Dächer und Kellerwände. Glaser-Nachverfahren zur Taupunkt- und Feuchtigkeitsbeurteilung.</p>

        <article id="nachhaltigkeit_info_seo">
          <h3>Zirkuläre Nachhaltigkeit, Ökobilanzierung (LCA) &amp; QNG</h3>
          <p>Ökobilanzierung nach DIN EN 15804+A2 (GWP-total, GWP-fossil, GWP-biogenic, PENRT, PERT) und DIN EN 15978 über die Lebenszyklusphasen A1–A3, B, C1–C4 und Modul D. Zertifizierung nach dem staatlichen QNG-Qualitätssiegel (BMWSB / KFN-Förderung), Verknüpfung zur ÖKOBAUDAT sowie zirkuläre Kennwerte wie Urban Mining Index (UMI) und Materialpässe.</p>
        </article>

        <!-- Bauen im Bestand -->
        <article id="bestand_info_seo">
          <h3>Bauen im Bestand &amp; WTA-Merkblätter (WTA 2-9 / WTA 4-6 / DIN 18533)</h3>
          <p>Erfassung und Diagnose von Bestandsbauwerken. Sanierputzsysteme nach WTA-Merkblatt 2-9 (Ausgabe 2020), nachträgliche Bauwerksabdichtung nach WTA-Merkblatt 4-6 in systematischer Verknüpfung mit DIN 18533 (Wassereinwirkungsklassen W1-E bis W4-E, Rissklassen RÜ1-E bis RÜ4-E und Raumnutzungsklassen RN1-E bis RN3-E).</p>
        </article>

        <!-- Rückbau und Schadstoffe -->
        <article id="rueckbau_info_seo">
          <h3>Rückbau, Ersatzbaustoffverordnung (EBV) &amp; GefStoffV (Stand 2026)</h3>
          <p>Geordneter selektiver Rückbau nach Ersatzbaustoffverordnung (EBV) mit Materialklassen RC-1, RC-2, RC-3, Bodenmaterial (BM) und Gleisschotter (GS) unter Beachtung der Güteüberwachung. Asbest- und Gefahrstoffsanierung nach novellierter GefStoffV und TRGS 519 inkl. Bauherren-Erkundungspflicht (vor dem 31.10.1993) und risikobasiertem Ampelmodell (grün/gelb/rot).</p>
        </article>

        <!-- Dauerhaftigkeit & Schäden -->
        <article id="dauerhaftigkeit_info_seo">
          <h3>Dauerhaftigkeit &amp; Schadensanalytik</h3>
          <p>Mechanismen von Bauschäden: Alkalitreiben (Betonkrebs / AKR), Bewehrungskorrosion infolge Chlorideintrag oder Carbonatisierung, Holzfäule durch Pilze und statische Bewertung nach VDI 6200.</p>
        </article>

        <!-- Innenausbau -->
        <article id="innenausbau_seo">
          <h3>Innenausbau &amp; Trockenbau (DIN 18181 / DIN 18560)</h3>
          <p>Zentrales Übersichtsmodul für modernen Innenausbau und Trockenbau: Metall-Ständerwerke (CW/UW), Gipsplatten (DIN EN 520 / Typ A, DF, DFH2IR), Fließ- und Zementestriche, Trittschallverbesserungsmaß, Belegreife nach CM-Methode sowie Brandschutzdecken F30 bis F90.</p>
        </article>

        <!-- Schutz- & Instandsetzungs-Grundlagen -->
        <article id="schutz_grundlagen_seo">
          <h3>Schutz- &amp; Instandsetzungs-Grundlagen (DIN EN 1504-9 / TR Instandhaltung)</h3>
          <p>Europäisches Prinzipiensystem: Prinzipien 1 bis 6 für Betongefügeschutz und Prinzipien 7 bis 11 für Bewehrungskorrosion. Gegenüberstellung von passivem Barriereschutz (Hydrophobierung, OS-Beschichtungen) und aktivem elektrochemischem Schutz (KKS nach DIN EN ISO 12696, Realkalisierung). Modellierung der Restnutzungsdauer nach Tuutti und De-Sitter-Kostenfortschritt (Law of Fives).</p>
        </article>

        <!-- Stahlbetoninstandhaltung -->
        <article id="instandhaltung_seo">
          <h3>Stahlbetoninstandhaltung &amp; Technische Regel Instandhaltung (DIBt)</h3>
          <p>Planung und Ausführung von Instandsetzungen an tragenden Betonbauteilen nach DIBt TR Instandhaltung (MVV TB): Prinzipien W, C, R, K. Systematik der Oberflächenschutzsysteme OS 1 bis OS 11 (OS 8 starr, OS 11 rissüberbrückend), Rissinjektion nach DIN EN 1504-5 (Klassen F, D, S), Fick-II Chloriddiffusionsrechner und Kathodischer Korrosionsschutz (KKS).</p>
        </article>

        <!-- Instandsetzung nach Materialien -->
        <article id="instandsetzung_materialien_seo">
          <h3>Werkstoffspezifischer Bautenschutz &amp; Instandsetzung</h3>
          <p>Sanierungsverfahren für die Hauptwerkstoffe des Bauwesens: Holzschutz und Holzinstandsetzung nach DIN 68800 (GK 0 bis GK 4, Schwammsanierung, Holzprothesen), Korrosionsschutz von Stahlbauten nach DIN EN ISO 12944 (Korrosivitätskategorien C1 bis CX, Schutzdauer L/M/H/VH, Sa 2 ½, Duplex-Systeme), Schweißen und Fugenabdichtung bei Kunststoffen nach DVS und DIN 18540 sowie Erhaltung von Asphaltbefestigungen nach ZTV BEA-StB.</p>
        </article>

        <!-- WTA-Merkblätter -->
        <article id="wta_seo">
          <h3>WTA-Merkblätter &amp; Bauwerkserhaltung im Bestand</h3>
          <p>Wissenschaftlich-Technische Arbeitsgemeinschaft für Bauwerkserhaltung und Denkmalpflege: WTA-zertifizierte Sanierputzsysteme (Merkblatt 2-9 / 2-10), Injektionsverfahren gegen kapillar aufsteigende Feuchte (Merkblatt 4-4 / 4-10), nachträgliche Bauwerksabdichtung erdberührter Bauteile (Merkblatt 4-6) und hygrothermische Nachweise für Innendämmungen (Merkblatt 6-4 / 6-5).</p>
        </article>

        <!-- Instandsetzungs-Checklisten -->
        <article id="instandsetzung_checklisten_seo">
          <h3>Interaktive Instandsetzungs-Checklisten &amp; Qualitätssicherung</h3>
          <p>Strukturiertes Baustellenprotokoll für Ingenieure und Sachkundige Planer (SKP): Checklisten von der Voruntersuchung über Untergrundvorbereitung mit Höchstdruckwasserstrahlen (HDW 1000–2000 bar), Bewehrungsfreilegung (15 mm Hinterstemmung), Abreißfestigkeit (mind. 1,5 MPa), Mörtelapplikation (PCC/SPCC), Taupunktkontrolle, Rissinjektion bis zur SIVV-Bauüberwachung und Abnahme.</p>
        </article>
