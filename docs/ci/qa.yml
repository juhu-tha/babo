name: QA

on:
  push:
    branches: [main]
  pull_request:

jobs:
  qa:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Typprüfung und ESLint
        run: npm run -s lint
      - name: Tests
        run: npm test
      - name: Formeln (KaTeX)
        run: npm run -s check:formeln
      - name: Quellen
        run: npm run -s check:quellen
      - name: Zahlformat
        run: npm run -s check:zahlen
      - name: Build
        run: npx vite build
