name: Barrierefreiheit und Mobil-Layout

# Umsetzungsplan Phase 2, AP 2.1: axe-Prüfung aller Modulrouten gegen docs/a11y-baseline.json (Ratchet).
# Läuft rund 20 Minuten, deshalb nicht bei jedem PR, sondern nach Merges auf main, wöchentlich und manuell.
on:
  push:
    branches: [main]
  schedule:
    - cron: '17 3 * * 1'
  workflow_dispatch:

jobs:
  a11y:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund
      - run: npx vite build
      - name: Prüfwerkzeuge (nicht in package.json)
        run: |
          npm install --no-save --no-audit --no-fund playwright @axe-core/playwright
          npx playwright install --with-deps chromium
      - name: Vorschau-Server starten
        run: |
          npx vite preview --port 4173 --strictPort &
          npx --yes wait-on http://localhost:4173/
      - name: axe gegen Baseline
        run: node scripts/qa/a11y.mjs --vergleich
      - name: Mobil-Layout (390 px)
        run: node scripts/qa/layout-mobil.mjs
